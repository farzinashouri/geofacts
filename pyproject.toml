[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "geofacts"
version = "0.1.0"
description = "Machine-checked geospatial product facts, reachable only with the scope that makes them correct"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Farzin Ashouri", email = "fashouri@gmail.com" }]
keywords = ["sentinel-2", "sentinel-1", "remote-sensing", "earth-observation", "radiometry", "nodata"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
    "Typing :: Typed",
]

# Zero dependencies, permanently. This is the entire adoption argument:
# a test helper that drags in a solver stack does not get vendored.
dependencies = []

[project.urls]
Homepage = "https://github.com/farzinashouri/geofacts"
Repository = "https://github.com/farzinashouri/geofacts"
Issues = "https://github.com/farzinashouri/geofacts/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[tool.hatch.build.targets.wheel]
# The witnesses under _witnesses/ ship inside the package: without them the
# installed copy cannot check itself, which is the property that makes the
# table worth depending on. They are picked up as package data automatically.
packages = ["src/geofacts"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
